<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>全局样式预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: auto !important; overflow: visible !important; }
  body {
    background: #f2f2f7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #1c1c1e;
    padding: 12px 12px 30px;
  }
  .pv-title { max-width: 430px; margin: 0 auto 10px; font-size: 14px; font-weight: 600; color: #8e8e93; }
  .app-container {
    width: 100%; max-width: 430px; margin: 0 auto 16px;
    background: #ffffff; border-radius: 22px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.08);
    display: flex; flex-direction: column; position: relative;
  }
  .app-content { flex: 1; padding: 56px 14px 78px; }
  .top-bar {
    position: absolute; top: 12px; left: 14px; right: 14px;
    display: flex; align-items: center; justify-content: space-between; z-index: 20;
  }
  .top-bar .spacer { flex: 1; }
  .menu-btn, .add-btn {
    width: 36px; height: 36px; border-radius: 50%; background: #fff;
    border: .5px solid rgba(0,0,0,.05); display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #1c1c1e; box-shadow: 0 2px 8px rgba(0,0,0,.04);
  }
  .app-title { font-size: 17px; font-weight: 700; align-self: center; }
  .chat-list { display: flex; flex-direction: column; }
  .chat-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 6px; border-bottom: 1px solid rgba(60,60,67,.08);
  }
  .chat-avatar {
    width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg,#d7d7e0,#e9e9f2);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 600; color: #6c6c70;
  }
  .chat-info { flex: 1; min-width: 0; }
  .chat-name { font-size: 15px; font-weight: 600; }
  .chat-msg { font-size: 12px; color: #8e8e93; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-time { font-size: 11px; color: #aeaeb2; align-self: flex-start; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 8px; }
  .grid-card {
    aspect-ratio: 1 / 1; border-radius: 16px; background: #f5f5f7;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    font-size: 12px; color: #6c6c70;
  }
  .grid-card .emoji { font-size: 24px; }
  .bottom-actions {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px; z-index: 20;
  }
  .capsule-group {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.72); backdrop-filter: blur(20px);
    border-radius: 30px; padding: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.08);
  }
  .capsule-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent;
    display: flex; align-items: center; justify-content: center; color: #8e8e93; font-size: 16px;
  }
  .capsule-btn.active-btn { background: #007aff; color: #fff; }
  .circle-more {
    width: 48px; height: 48px; border-radius: 50%; background: #007aff; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    box-shadow: 0 6px 20px rgba(0,122,255,.35);
  }
  .pv-tip { max-width: 430px; margin: 4px auto 0; text-align: center; font-size: 11px; color: #aeaeb2; }
</style>
</head>
<body>
  <div class="pv-title">全局样式预览 · 静态示例</div>

  <div class="app-container">
    <div class="top-bar">
      <div class="menu-btn">≡</div>
      <div class="app-title">消息</div>
      <div class="add-btn">＋</div>
    </div>
    <div class="app-content">
      <div class="chat-list">
        <div class="chat-item">
          <div class="chat-avatar">林</div>
          <div class="chat-info"><div class="chat-name">林清越</div><div class="chat-msg">晚上一起吃饭吗？</div></div>
          <div class="chat-time">14:20</div>
        </div>
        <div class="chat-item">
          <div class="chat-avatar">苏</div>
          <div class="chat-info"><div class="chat-name">苏晚</div><div class="chat-msg">我：照片收到啦</div></div>
          <div class="chat-time">13:05</div>
        </div>
        <div class="chat-item">
          <div class="chat-avatar">群</div>
          <div class="chat-info"><div class="chat-name">周末约饭群</div><div class="chat-msg">柚子：带我一个～</div></div>
          <div class="chat-time">昨天</div>
        </div>
        <div class="chat-item">
          <div class="chat-avatar">顾</div>
          <div class="chat-info"><div class="chat-name">顾时</div><div class="chat-msg">[表情包] 晚安</div></div>
          <div class="chat-time">昨天</div>
        </div>
      </div>
    </div>
    <div class="bottom-actions">
      <div class="capsule-group">
        <button class="capsule-btn active-btn">💬</button>
        <button class="capsule-btn">🎛</button>
        <button class="capsule-btn">🧭</button>
        <button class="capsule-btn">🗺</button>
      </div>
      <div class="circle-more">📞</div>
    </div>
  </div>

  <div class="app-container">
    <div class="top-bar">
      <div class="menu-btn">≡</div>
      <div class="app-title">发现</div>
      <div class="add-btn">＋</div>
    </div>
    <div class="app-content">
      <div class="grid">
        <div class="grid-card"><span class="emoji">📷</span>相册</div>
        <div class="grid-card"><span class="emoji">🎵</span>音乐</div>
        <div class="grid-card"><span class="emoji">📖</span>世界书</div>
        <div class="grid-card"><span class="emoji">🧠</span>记忆</div>
        <div class="grid-card"><span class="emoji">💌</span>动态</div>
        <div class="grid-card"><span class="emoji">⚙️</span>设置</div>
      </div>
    </div>
    <div class="bottom-actions">
      <div class="capsule-group">
        <button class="capsule-btn">💬</button>
        <button class="capsule-btn">🎛</button>
        <button class="capsule-btn active-btn">🧭</button>
        <button class="capsule-btn">🗺</button>
      </div>
      <div class="circle-more">📞</div>
    </div>
  </div>

  <div class="pv-tip">这是固定示例，不会显示你的真实联系人与聊天</div>
</body>
</html>
