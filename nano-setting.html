<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>纳米设置</title>
  <link rel="stylesheet" href="css/nano-setting.css">
  <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
  <script src="js/appearance.js"></script>
</head>
<body class="nano-nsetting">
  <div class="ns-app" id="nsApp">
    <header class="ns-topbar">
      <button class="ns-back" id="nsBack" data-back aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="ns-title">纳米设置</span>
      <span style="width:32px"></span>
    </header>

    <div class="ns-scroll">
      <!-- 资料 -->
      <div class="ns-profile">
        <button class="ns-avatar" id="nsAvatarBtn" aria-label="更换头像">
          <img id="nsAvatar" alt="">
          <span class="ns-avatar-edit">换</span>
        </button>
        <div class="ns-profile-main">
          <input class="ns-name" id="nsName" maxlength="16" placeholder="纳米">
          <div class="ns-sub">纳米专属助手 · 独立于其他角色</div>
        </div>
      </div>
      <input type="file" id="nsAvatarFile" accept="image/*" style="display:none">
      <div class="ns-row" id="nsAvatarUrlRow">
        <input class="ns-input" id="nsAvatarUrl" placeholder="或输入头像图片 URL">
        <button class="ns-mini-btn" id="nsAvatarUrlSave">使用</button>
      </div>

      <!-- 数据概览 -->
      <div class="ns-card">
        <div class="ns-card-title">数据概览</div>
        <div class="ns-stats">
          <div class="ns-stat"><b id="stMsgs">0</b><span>消息条数</span></div>
          <div class="ns-stat"><b id="stFloor">0</b><span>聊天楼层</span></div>
          <div class="ns-stat"><b id="stTokens">0</b><span>≈Tokens</span></div>
          <div class="ns-stat"><b id="stMemory">0</b><span>记忆条数</span></div>
        </div>
        <div class="ns-hint">Tokens 由字符估算，仅供参考。</div>
      </div>

      <!-- 记录 -->
      <div class="ns-card">
        <div class="ns-card-title">
          <span>聊天记录</span>
          <button class="ns-danger" id="nsDeleteAll">删除全部</button>
        </div>
        <div class="ns-records" id="nsRecords"></div>
      </div>

      <!-- 内置提示词 -->
      <div class="ns-card">
        <div class="ns-card-title">内置提示词（每次生成都会遵守）</div>
        <textarea class="ns-textarea" id="nsPrompt" placeholder="例如：回答尽量精简；CSS 主题优先用莫兰迪色系；必须给出可复制的完整 CSS。"></textarea>
        <button class="ns-primary" id="nsPromptSave">保存提示词</button>
      </div>

      <div style="height:40px"></div>
    </div>

    <div class="ns-toast" id="nsToast"></div>
  </div>

  <script src="js/nano-setting.js"></script>
  <script src="swipe-back.js"></script>
</body>
</html>
