<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nano · 聊天</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="css/chat.css">
    <script src="js/appearance.js"></script>
    <script src="js/nano-badge.js"></script>
<script src="js/group-store.js"></script>
</head>
<body class="nano-chat">
<div class="app-container">
    <div class="app-content">

        <!-- 页面顶栏：人设 / 角色库（位于灵动岛下方、Nano 上方） -->
        <div class="page-topbar">
            <button class="page-topbar-btn" id="maskPageBtn" type="button" aria-label="人设"><i class="fas fa-bars"></i></button>
            <button class="page-topbar-btn primary" id="characterPageBtn" type="button" aria-label="角色库"><i class="fas fa-plus"></i></button>
        </div>

        <!-- Nano 品牌 -->
        <div class="nano-brand">Nano</div>

        <!-- 状态栏 -->
        <div class="user-status-wrapper">
            <div class="user-status-bar" id="userStatusBar">
                <div class="left">
                    <div class="user-avatar" id="userAvatar">
                        <span id="userAvatarPlaceholder">?</span>
                        <img id="userAvatarImage" style="display:none;" alt="头像">
                    </div>
                    <span class="user-name" id="userNameDisplay">
                        <span class="placeholder">选择人设</span>
                    </span>
                </div>
                <div class="right">
                    <span class="char-count" id="charCountDisplay">0</span>
                    <span class="arrow" id="arrowIcon">⌵</span>
                </div>
            </div>
            <div class="user-dropdown" id="userDropdown"></div>
        </div>

        <!-- 头像行 -->
        <div class="avatar-row" id="avatarRow">
            <div class="avatar-item" data-index="0"></div>
            <div class="avatar-item" data-index="1"></div>
            <div class="avatar-item" data-index="2"></div>
            <div class="avatar-item" data-index="3"></div>
            <div class="avatar-item avatar-add" id="avatarAddBtn"><i class="fas fa-plus"></i></div>
        </div>

        <!-- 搜索框 -->
        <div class="search-wrap">
            <div class="search-box">
                <i class="fas fa-search" id="searchIcon"></i>
                <input type="text" placeholder="搜索联系人、群聊" id="searchInput" autocomplete="off">
                <span class="search-clear hidden" id="searchClear"><i class="fas fa-times-circle"></i></span>
            </div>
        </div>

        <!-- Tab 切换 -->
        <div class="tabs-switch">
            <div class="tab-group">
                <button class="tab-btn active" id="tabFriends">好友</button>
                <button class="tab-btn" id="tabGroups">群聊</button>
            </div>
        </div>

        <!-- 聊天列表 -->
        <div class="chat-list" id="chatList">
            <div class="no-result" id="noResult">未找到相关联系人</div>
        </div>

    </div>
</div>

<!-- 群聊创建弹窗 -->
<div class="group-modal" id="groupModal">
    <div class="group-modal-card">
        <h4>创建群聊</h4>
        <div class="sub-title" id="groupSubTitle">设置群信息并添加成员</div>
        <div class="group-avatar-picker">
            <div class="g-avatar" id="groupAvatarPicker">
                <span id="groupAvatarPlaceholder">+</span>
                <img id="groupAvatarPreview" style="display:none;" alt="群头像">
            </div>
        </div>
        <div class="group-form-group">
            <label>群名称</label>
            <input type="text" id="groupNameInput" placeholder="输入群名称">
        </div>
        <div class="group-add-member-row">
            <select id="groupMemberSelect"><option value="">选择要添加的成员...</option></select>
            <button class="btn-add-member" id="groupAddMemberBtn">添加</button>
        </div>
        <div class="group-member-list" id="groupMemberList"></div>
        <div class="group-modal-actions">
            <button class="btn-cancel" id="groupCancel" data-close>取消</button>
            <button class="btn-add" id="groupConfirm">创建</button>
        </div>
    </div>
</div>

<!-- 头像弹窗 -->
<div class="ios-modal" id="avatarModal">
    <div class="ios-modal-card">
        <h4>更换头像</h4>
        <div class="ios-modal-actions">
            <button id="modalGallery"><i class="fas fa-images"></i>从图库选择</button>
            <button id="modalUrlBtn"><i class="fas fa-link"></i>输入 URL</button>
            <button class="cancel-btn" id="modalCancel" data-close>取消</button>
        </div>
        <div id="urlInputArea" style="display:none;">
            <div class="url-input-wrap">
                <input type="text" id="urlInput" placeholder="输入图片链接 (https://...)" autocomplete="off">
            </div>
            <button class="url-submit-btn" id="urlSubmit">确认</button>
        </div>
    </div>
</div>

<!-- 群头像弹窗 -->
<div class="ios-modal" id="groupAvatarModal">
    <div class="ios-modal-card">
        <h4>更换群头像</h4>
        <button class="modal-option" id="groupAvatarGallery">从图库选择</button>
        <div class="modal-divider"></div>
        <button class="modal-option" id="groupAvatarUrl">输入图片 URL</button>
        <div class="modal-actions">
            <button class="modal-btn" id="groupAvatarCancel" data-close>取消</button>
        </div>
    </div>
</div>

<input type="file" class="file-input-hidden" id="groupImageFileInput" accept="image/*" style="display:none;">

<script src="js/chat.js"></script>
<script src="js/api-float.js"></script>
<script src="swipe-back.js"></script>
</body>
</html>
